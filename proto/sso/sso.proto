syntax = "proto3";

package auth;

option go_package = "sso.v1;ssov1";

import "google/protobuf/empty.proto";

service Auth{
  rpc Register (RegisterRequest) returns (RegisterResponse);
  rpc Login (LoginRequest) returns (LoginResponse);
  rpc Refresh (RefreshRequest) returns (RefreshResponse);
  rpc Logout (LogoutRequest) returns (google.protobuf.Empty);
}

message RegisterRequest{
  string email = 1; // Users email to register
  string password = 2; // Users password to register
}

message RegisterResponse{
  int64 user_id = 1; // ID of registered user
}

message LoginRequest{
  string email = 1; // Users email to login
  string password = 2; // Users password to login
  int32 app_id = 3; // ID app to login
}

message LoginResponse{
  string token = 1; // auth token of logged in user
  optional string refresh_token = 2; // refresh token of logged in user
}

message RefreshRequest{
  optional string refresh_token = 1; // users refresh token
}

message RefreshResponse{
  string access_token = 1; // new access token
  optional string refresh_token = 2; // new refresh token
}

message LogoutRequest{
  optional string refresh_token = 1; // users refresh token
  optional bool revoke_all = 2; // revoke all sessions
}
